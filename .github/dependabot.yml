version: 2
# Dependabot only reads this file from the default branch (master). The
# rails-* branches are covered from here by the entries with `target-branch`,
# so keep this file in step with each branch's ci/ and gemfiles/ directories.
updates:

# master (Rails 8.1)
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: daily
  versioning-strategy: lockfile-only
- package-ecosystem: docker
  directory: "/"
  schedule:
    interval: daily
- package-ecosystem: docker
  directory: "/ci/ruby3.2"
  schedule:
    interval: daily
  ignore:
  - dependency-name: ruby
    versions:
    - ">= 3.3"
- package-ecosystem: docker
  directory: "/ci/ruby3.3"
  schedule:
    interval: daily
  ignore:
  - dependency-name: ruby
    versions:
    - ">= 3.4"
- package-ecosystem: docker
  directory: "/ci/ruby3.4"
  schedule:
    interval: daily
  ignore:
  - dependency-name: ruby
    versions:
    - ">= 3.5"
- package-ecosystem: docker
  directory: "/ci/ruby4.0"
  schedule:
    interval: daily
  ignore:
  - dependency-name: ruby
    versions:
    - ">= 4.1"
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: daily

# rails-8.0
