name: RSpec

on:
  push:
    branches: [rails-7.1]
  pull_request:
    branches: [rails-7.1]

permissions:
  contents: read

jobs:
  rspec:
    name: rspec (${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each entry is a directory under ci/ whose Dockerfile pins the Ruby image (kept up to date by Dependabot)
        ruby: [ruby2.7, ruby3.0, ruby3.1, ruby3.2, ruby3.3, ruby3.4, ruby4.0]
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t rspec-${{ matrix.ruby }} ci/${{ matrix.ruby }}

      # Rubies that the top-level Gemfile.lock no longer supports have their own
      # Gemfile and Gemfile.lock under gemfiles/<ruby>/
      - name: Select Gemfile
        run: |
          if [ -f "gemfiles/${{ matrix.ruby }}/Gemfile" ]; then
            echo "GEMFILE=gemfiles/${{ matrix.ruby }}/Gemfile" >> "$GITHUB_ENV"
          else
            echo "GEMFILE=Gemfile" >> "$GITHUB_ENV"
          fi

      - uses: actions/cache@v6
        with:
          path: vendor/bundle
          key: bundle-${{ matrix.ruby }}-${{ hashFiles(format('ci/{0}/Dockerfile', matrix.ruby)) }}-${{ hashFiles(format('{0}.lock', env.GEMFILE)) }}
          restore-keys: bundle-${{ matrix.ruby }}-${{ hashFiles(format('ci/{0}/Dockerfile', matrix.ruby)) }}-

      - name: Run RSpec
        run: >-
          docker run --rm -v "$PWD:/app" -w /app
          -e BUNDLE_GEMFILE="/app/$GEMFILE" -e BUNDLE_PATH=/app/vendor/bundle -e BUNDLE_FROZEN=true
          rspec-${{ matrix.ruby }}
          sh -c "ruby -v && bundle install --jobs 4 && bundle exec rspec"
