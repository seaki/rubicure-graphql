name: RSpec

on:
  push:
    branches: [rails-8.0]
  pull_request:
    branches: [rails-8.0]

permissions:
  contents: read

jobs:
  rspec:
    name: rspec (${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each entry is a directory under ci/ whose Dockerfile pins the Ruby image (kept up to date by Dependabot)
        ruby: [ruby3.3, ruby3.4, ruby4.0]
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t rspec-${{ matrix.ruby }} ci/${{ matrix.ruby }}

      - uses: actions/cache@v6
        with:
          path: vendor/bundle
          key: bundle-${{ matrix.ruby }}-${{ hashFiles(format('ci/{0}/Dockerfile', matrix.ruby)) }}-${{ hashFiles('Gemfile.lock') }}
          restore-keys: bundle-${{ matrix.ruby }}-${{ hashFiles(format('ci/{0}/Dockerfile', matrix.ruby)) }}-

      - name: Run RSpec
        run: >-
          docker run --rm -v "$PWD:/app" -w /app
          -e BUNDLE_PATH=/app/vendor/bundle -e BUNDLE_FROZEN=true
          rspec-${{ matrix.ruby }}
          sh -c "ruby -v && bundle install --jobs 4 && bundle exec rspec"

  # RSpec runs in the test environment on the images under ci/. This job builds the
  # image of the top-level Dockerfile, the one that gets deployed, and checks that the
  # application starts and responds in production mode.
  production:
    name: production (Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t rubicure-graphql .

      - name: Check the endpoints in production mode
        run: docker run --rm rubicure-graphql ruby script/production_smoke.rb
